{% extends "base.html" %}

{% block title %}{{ 'Edit Trek' if trek else 'Create New Trek' }} - TrekSync{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold mb-0">{{ 'Edit Trek Details' if trek else 'Create Trek Route' }}</h1>
        <a href="{{ url_for('admin_treks') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to List
        </a>
    </div>

    <div class="card border-0 shadow-lg p-4 bg-white">
        <form action="{{ url_for('admin_edit_trek', trek_id=trek.id) if trek else url_for('admin_create_trek') }}" method="POST">
            <!-- Trek Name & Location -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label fw-semibold">Trek Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Kedarkantha Summit" value="{{ trek.name if trek else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="location" class="form-label fw-semibold">Location</label>
                    <input type="text" class="form-control" id="location" name="location" placeholder="e.g. Uttarakhand, India" value="{{ trek.location if trek else '' }}" required>
                </div>
            </div>

            <!-- Difficulty, Duration, Max Slots -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="difficulty" class="form-label fw-semibold">Difficulty Level</label>
                    <select class="form-select" id="difficulty" name="difficulty" required>
                        <option value="Easy" {% if trek and trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option value="Moderate" {% if trek and trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                        <option value="Hard" {% if trek and trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="duration" class="form-label fw-semibold">Duration (in Days)</label>
                    <input type="number" class="form-control" id="duration" name="duration" min="1" placeholder="e.g. 5" value="{{ trek.duration if trek else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label for="max_slots" class="form-label fw-semibold">Max Available Slots</label>
                    <input type="number" class="form-control" id="max_slots" name="max_slots" min="1" placeholder="e.g. 25" value="{{ trek.max_slots if trek else '' }}" required>
                </div>
            </div>

            <!-- Start Date & End Date -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="start_date" class="form-label fw-semibold">Start Date</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" value="{{ trek.start_date.strftime('%Y-%m-%d') if trek else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="end_date" class="form-label fw-semibold">End Date</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" value="{{ trek.end_date.strftime('%Y-%m-%d') if trek else '' }}" required>
                </div>
            </div>

            <!-- Staff Assignment & Status -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="staff_id" class="form-label fw-semibold">Assign Trek Guide (Staff)</label>
                    <select class="form-select" id="staff_id" name="staff_id">
                        <option value="">-- Unassigned --</option>
                        {% for staff in approved_staff %}
                            <option value="{{ staff.user.id }}" {% if trek and trek.staff_id == staff.user.id %}selected{% endif %}>
                                {{ staff.user.username }} (ID: #{{ staff.user.id }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="status" class="form-label fw-semibold">Trek Status</label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="Pending" {% if trek and trek.status == 'Pending' %}selected{% endif %}>Pending Approval</option>
                        <option value="Approved" {% if trek and trek.status == 'Approved' %}selected{% endif %}>Approved (Ready)</option>
                        <option value="Open" {% if trek and trek.status == 'Open' %}selected{% endif %}>Open (Booking Active)</option>
                        <option value="Closed" {% if trek and trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                        <option value="Completed" {% if trek and trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold shadow-sm">
                {{ 'Save Changes' if trek else 'Create Trek Route' }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
