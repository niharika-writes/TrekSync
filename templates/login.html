{% extends "base.html" %}

{% block title %}Login - TrekSync{% endblock %}

{% block content %}
<div class="container">
    <div class="card auth-card shadow-lg bg-white border-0">
        <div class="text-center mb-4">
            <i class="bi bi-compass text-success fs-1"></i>
            <h2 class="mt-2 fw-bold">Welcome Back</h2>
            <p class="text-muted">Sign in to manage your treks</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label fw-semibold mb-1">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold mb-3">Sign In</button>
        </form>

        <hr class="text-muted">

        <div class="text-center">
            <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
